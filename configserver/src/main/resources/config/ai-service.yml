server:
  port: 8083
spring:
  application:
    name: ai-service
  data:
    mongodb:
      uri: ${MONGO_URI}
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}


eureka:
  client:
    service-url:
        defaultZone: http://localhost:8761/eureka/

rabbitmq:
  exchange:
    name: fitness.exchange
  queue:
    name: activity.queue
  routing:
    key: activity.tracking

gemini:
    api:
        url: ${GEMINI_API_URL}
        key: ${GEMINI_API_KEY}
